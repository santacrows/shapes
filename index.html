<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shapes</title>
<style>
:root {
    --bg: #0b0618; --ink: #fff; --atk: #ff4d5e; --blk: #4da3ff; 
    --sp: #59e07a; --gold: #ffd54a; --drw: #9be7ff;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 700 13px ui-monospace, Menlo, Consolas, monospace; overflow: hidden; touch-action: manipulation;
}
#app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; padding: 20px 0; box-sizing: border-box; }
.win { background: #000; border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #444; }

#top { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; flex-wrap: wrap; gap: 4px; }
#pips { display: flex; gap: 3px; align-items: center; }
#pips i { width: 12px; height: 12px; border: 2px solid #fff; border-radius: 3px; }
#pips i.d { background: var(--gold); }
#pips i.c { background: #fff; }
#pips i:nth-child(9) { border-radius: 50%; }

#arena { flex: 1; position: relative; overflow: hidden; margin: 24px 6px; border-radius: 12px; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; min-height: 0; }
#arena:before { content: ""; position: absolute; inset: -60%; background: var(--bgg, repeating-conic-gradient(#6a1b9a 0 10deg, #1b0a4d 10deg 20deg, #ff2e88 20deg 30deg, #1b0a4d 30deg 40deg)); animation: spin 50s linear infinite; opacity: .6; filter: hue-rotate(var(--h,0deg)); }
#arena:after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, transparent 35%, #000 130%); }
@keyframes spin { to { transform: rotate(360deg); } }
#arena.a2:before { inset: -50px 0 -50px -120px; background: var(--bgg); background-size: 120px 80px; opacity: .7; animation: wvx 3.5s linear infinite, wvy 4s ease-in-out infinite alternate; }
#arena.a3:before { inset: auto; left: 50%; top: 50%; width: var(--sz); height: var(--sz); margin: calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2); background: var(--bgg) center / 100% 100%; animation: spin 30s linear infinite reverse, breathe 6s ease-in-out infinite alternate; }
@keyframes wvx { to { translate: 120px 0; } }
@keyframes wvy { from { transform: translateY(-30px); } to { transform: translateY(30px); } }
@keyframes breathe { from { scale: 1; } to { scale: 1.35; } }
@keyframes wob { 50% { transform: translateY(7px) rotate(4deg); } }
#fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; }
#en { position: relative; z-index: 2; display: flex; gap: 4px; align-items: flex-end; justify-content: center; width: 100%; padding: 0 6px; }

.e { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.n1 .e { max-width: 210px; } .n2 .e { max-width: 160px; }
.sw { width: 100%; position: relative; animation: wob 2.4s ease-in-out infinite; display: flex; justify-content: center; }
.sh { display: block; filter: drop-shadow(0 4px 0 #0008); }
.e.tg .sw { filter: drop-shadow(0 0 10px #fff); }
.int { padding: 2px 6px; display: flex; gap: 6px; min-height: 24px; align-items: center; font-size: 13px; }
.int span, .ch { display: inline-flex; align-items: center; gap: 2px; }
.int:empty { visibility: hidden; }
.hp { height: 9px; width: 90%; background: #000; border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
.hp i { display: block; height: 100%; background: #59e07a; transition: width .3s; }
.st { font-size: 11px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; text-shadow: 1px 1px 0 #000; }
.fl { position: absolute; left: 0; right: 0; top: 10%; text-align: center; font-size: 22px; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 5; }

#lr { display: flex; gap: 6px; margin: 6px; height: 50px; }
#log { flex: 1; min-width: 0; margin: 0; padding: 3px 8px; font-size: 12px; line-height: 1.15; display: flex; align-items: center; overflow: hidden; }
#pots { display: flex; gap: 4px; padding: 3px; align-items: center; flex: none; }
.ps { width: 32px; height: 38px; padding: 0; border: 2px dashed #555; border-radius: 7px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 1; color: #fff; }
.ps.f { border: 2px solid var(--gold); background: #14102a; box-shadow: 0 0 6px #ffd54a55; }
.ps.f:active { background: #333; }
#pl { display: flex; gap: 6px; padding: 0 6px; height: 58px; }
#hpw { position: relative; padding: 3px 10px; display: flex; flex-direction: column; justify-content: center; flex: 1.4; }
#hpn { font-size: 26px; line-height: 1; color: var(--sp); letter-spacing: 1px; }
#hpn.lo { color: var(--atk); }
#hpm { font-size: 14px; color: #aaa; margin-left: 2px; }
#nrg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px; transition: border-color .2s; }
.o { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gold); }
.o.f { background: var(--gold); }
button { font: inherit; color: inherit; cursor: pointer; }
#end { flex: .5; font-size: 14px; padding: 0; }
#end:active { background: #333; }

#hand { display: flex; justify-content: center; align-items: flex-end; height: 134px; padding: 14px 4px 8px; }
.cd { width: 74px; height: 108px; flex: none; border-radius: 9px; border: 3px solid var(--c); background: #14102a; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: transform .12s; box-shadow: 0 0 0 2px #000; }
.cd.sel { transform: translateY(-18px); z-index: 15; }
.cd:hover { z-index: 20; }
.cd.no { opacity: .45; }
.upb { position: absolute; bottom: 2px; right: 4px; font-size: 11px; line-height: 1; color: var(--gold); letter-spacing: -1px; }
.co { position: absolute; top: -9px; left: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #000; display: grid; place-items: center; border: 2px solid #000; }
.r { display: flex; align-items: center; gap: 3px; font-size: 14px; text-align: center; line-height: 1.1; }
.r small { font-size: 10px; opacity: .8; }

#ov { position: absolute; inset: 0; background: #05020ff0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; overflow-y: auto; }
#ov.on { display: flex; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.L .cd { width: 98px; height: 150px; gap: 9px; }
.L .r { font-size: 18px; }
.big { width: 104px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #000; }
.big:active { background: #333; }
.deal { animation: dl .25s; }
.pb { display: block; padding: 4px 12px; margin: 6px auto 0; }
.big small { font-size: 10px; font-weight: 400; line-height: 1.2; }
@keyframes dl { from { transform: translateY(60px); opacity: 0; } }

#nrg .or { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
#nrg .fc { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--gold); }
#nrg .fc i { width: 8px; height: 8px; border: 1.5px solid var(--gold); border-radius: 2px; }
#nrg .fc i.d { background: var(--gold); }
#nrg .fc i.l { border-radius: 50%; }
#nrg .fc b { margin-left: 3px; letter-spacing: 1px; }
#nrg.free { border-color: var(--gold); animation: freeGlow .8s ease-in-out infinite alternate; }
#nrg.free .o { background: var(--gold); animation: freeOrb .8s ease-in-out infinite alternate; }
@keyframes freeGlow { from { box-shadow: 0 0 0 2px #000, inset 0 0 6px 1px #ffd54a55, 0 0 6px 1px #ffd54a55; } to { box-shadow: 0 0 0 2px #000, inset 0 0 14px 4px #ffd54acc, 0 0 16px 4px #ffd54a99; } }
@keyframes freeOrb { from { transform: scale(.85); } to { transform: scale(1.2); box-shadow: 0 0 8px #ffd54a; } }
.co.fr { background: #59e07a; }
.cd.fr { box-shadow: 0 0 0 2px #000, 0 0 10px 2px #ffd54a99; }
#pips .as { margin-left: 6px; padding: 0 5px; border: 2px solid #c56cf0; border-radius: 6px; color: #c56cf0; font-size: 11px; line-height: 14px; }
#pips .as.z { border-color: #555; color: #777; }
input.cin { font: 700 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; width: 150px; padding: 7px 6px; background: #000; color: #fff; border: 3px solid #fff; border-radius: 10px; outline: none; user-select: text; -webkit-user-select: text; }
input.cin:focus { border-color: var(--gold); }
#vic { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
#vic .ttl { font-size: 34px; letter-spacing: 4px; background: linear-gradient(90deg,#ff4d5e,#ffd54a,#59e07a,#4da3ff,#c56cf0,#ff4d5e); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: vPop .7s cubic-bezier(.2,1.6,.4,1) both, vHue 3s linear infinite; filter: drop-shadow(0 0 10px #ffd54a99); }
#vic .rays { position: absolute; left: 50%; top: 110px; width: 420px; height: 420px; margin: -210px 0 0 -210px; z-index: -1; background: repeating-conic-gradient(#ffd54a33 0 8deg, transparent 8deg 24deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); animation: spin 14s linear infinite; }
#vic .hero { animation: vSpin 4s ease-in-out infinite; filter: drop-shadow(0 0 14px var(--hc)); }
#vic .sub { font-size: 15px; animation: vUp .6s .35s both; }
#vic .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; animation: vUp .6s .55s both; }
#vic .stats span { padding: 3px 8px; font-size: 12px; }
#vic .code { user-select: text; -webkit-user-select: text; font-size: 22px; letter-spacing: 4px; color: var(--gold); padding: 8px 14px; animation: vUp .6s .8s both, codeGlow 1.2s 1.4s ease-in-out infinite alternate; }
#vic .lbl { font-size: 12px; color: #ccc; animation: vUp .6s .75s both; }
#vic .btns { display: flex; gap: 10px; animation: vUp .6s 1s both; }
#vic .btns button { padding: 8px 16px; }
@keyframes vPop { from { transform: scale(.2) rotate(-8deg); opacity: 0; } }
@keyframes vHue { to { background-position: 300% 0; } }
@keyframes vSpin { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.12); } }
@keyframes vUp { from { transform: translateY(20px); opacity: 0; } }
@keyframes codeGlow { from { box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #444, 0 0 4px #ffd54a55; } to { box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #444, 0 0 18px 3px #ffd54acc; } }
#cf { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
#cf > div { position: absolute; top: -40px; animation: cfall linear infinite; }
@keyframes cfall { to { transform: translateY(calc(100vh + 80px)) rotate(var(--r)); } }
#vflash { position: absolute; inset: 0; background: #fff; z-index: 20; pointer-events: none; animation: vfl .9s ease-out forwards; }
@keyframes vfl { from { opacity: .9; } to { opacity: 0; } }
</style>
</head>
<body>
<div id="app">
    <div id="top">
        <div id="pips"></div>
        <div id="piles"></div>
    </div>
    <div id="arena">
        <div id="en"></div>
        <div id="fx"></div>
    </div>
    <div id="lr"><div id="log" class="win"></div><div id="pots" class="win"></div></div>
    
    <div id="pl">
        <div id="hpw" class="win">
            <div style="display:flex;align-items:center;gap:8px">
                <div id="avw" style="width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center"></div>
                <div>
                    <div style="display:flex;align-items:baseline">
                        <b id="hpn">0</b><span id="hpm"></span>
                    </div>
                    <div id="hpx" class="st" style="justify-content:flex-start"></div>
                </div>
            </div>
        </div>
        <div id="nrg" class="win"></div>
        <button id="end" class="win">END</button>
    </div>
    <div id="hand"></div>
    <div id="ov"></div>
</div>

<script>
const $ = s => document.querySelector(s),
      sleep = ms => new Promise(r => setTimeout(r, ms)),
      rnd = n => Math.random() * n | 0,
      pick = a => a[rnd(a.length)],
      shuf = a => { a = [...a]; for(let i = a.length; i > 1;) { const j = rnd(i--); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const P = {
    atk: '<path d="M12 1L17 14 12 23 7 14z"/>',
    blk: '<path d="M12 2L21 5V12C21 17 17 20 12 22 7 20 3 17 3 12V5z"/>',
    drw: '<rect x="3" y="6" width="12" height="16" rx="2" opacity=".5"/><rect x="9" y="2" width="12" height="16" rx="2"/>',
    nrg: '<circle cx="12" cy="12" r="8"/>',
    psn: '<path d="M12 2C12 2 5 10 5 15a7 7 0 0014 0C19 10 12 2 12 2z"/>',
    vul: '<path fill-rule="evenodd" d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-1 5h4l-2 4h3l-5 7 1-5H9l2-6z" clip-rule="evenodd"/>',

    amp: `<path d='M12 2l9 9h-6l-3-3-3 3H3zM12 12l9 9h-6l-3-3-3 3H3z'/>`,

    pot: '<path d="M10 2v4.5l-4.5 9c-.8 1.5.2 3.5 2 3.5h9c1.8 0 2.8-2 2-3.5L14 6.5V2h-4zm1 6.5l3.5 7h-7l3.5-7z"/>',
    exh: '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>',
    pi: '<path d="M11 2v10.17l-3.59-3.58L6 10l6 6 6-6-1.41-1.41L13 12.17V2h-2zm-7 16v2h16v-2H4z"/>',
    rnd: '<path fill-rule="evenodd" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 6.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-8 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8-8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-4 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" clip-rule="evenodd"/>',
    aoe: '<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>'
};

const COL = {
    atk: '#ff4d5e', blk: '#4da3ff', drw: '#9be7ff', nrg: '#ffd54a', 
    psn: '#b46bff', vul: '#ff9f43', str: '#ffd54a', hrt: '#59e07a', 
    amp: '#ff8a3d', gld: '#ffd54a', pot: '#e843d5',
    exh: '#ff7675', pi: '#fff', rnd: '#ffd54a', aoe: '#ff9f43'
};

const ic = (k, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${COL[k]}">${P[k]}</svg>`;

const SH = {
    tri: '<polygon points="50,8 94,88 6,88"/>',
    sq: '<rect x="12" y="12" width="76" height="76" rx="6"/>',
    cir: '<circle cx="50" cy="50" r="42"/>',

    pent: '<polygon points="50,5 95,38 78,92 22,92 5,38"/>',
    oct: '<polygon points="35,5 65,5 95,35 95,65 65,95 35,95 5,65 5,35"/>',
    arrow: '<polygon points="50,4 92,50 68,50 68,96 32,96 32,50 8,50"/>',
    moon: '<path d="M 52 5 A 45 45 0 1 1 7.5 67 A 39.3 39.3 0 0 0 52 5 Z"/>',
    trap: '<polygon points="20,30 80,30 95,85 5,85"/>',

    fang: '<path d="M14 6 C74 8 98 52 76 94 C74 62 44 48 14 6 Z"/>',
    hourglass: '<polygon points="16,6 84,6 84,18 58,50 84,82 84,94 16,94 16,82 42,50 16,18"/>',

function mkEnc(f) {
    if (f % 9 == 8) return [BOSSES[(f / 9 | 0) % 3]];
    let b = 1.5 + f * .6, o = [];
    const mw = 1 + f / 3;
    while (o.length < 3) {
        const c = ALLE.filter(x => x.w <= mw && x.w <= b);
        if (!c.length) break;
        const hi = c.filter(x => x.w >= Math.min(3, f / 9 | 0)), x = pick(hi.length ? hi : c);
        o.push(x);
        b -= x.w;
    }
    return o;
}

function start(el) {
    const f = S.f;

    const pals = [['#6a1b9a', '#1b0a4d', '#ff2e88', '#1b0a4d'], ['#009432', '#00220a', '#c4e538', '#00220a'], ['#0652dd', '#000b22', '#9980fa', '#000b22'], ['#ea2027', '#220000', '#ffc312', '#220000']], p = pals[Math.min(f / 9 | 0, 3)];

function tapCard(i) {

const R = n => S.rel.includes(n), amp = d => d * (1 + B.amp / 100) | 0;
const freeNow = () => R(4) && B.cn % 5 == 4, cost = c => freeNow() ? 0 : c.c;

function dmgE(e, d, pi) {

async function play(i, t) {
    const o = B.hand[i]; let c = o;
    if (c.z && !B.busy && cost(c) <= B.energy) {
        const g = Math.random() < .5 + B.lk ? (B.lk = 0, 2.4) : (B.lk = Math.min(.4, B.lk + .1), .7);
        c = { ...o };
        ['d', 'k', 'p'].forEach(k => c[k] && (c[k] = Math.max(1, Math.round(c[k] * g))));
        fl($('#hpw'), g > 1 ? 'JACKPOT' : 'miss', g > 1 ? '#ffd54a' : '#aaa');
    }
    if (B.busy || cost(c) > B.energy) return;
    
    B.busy = true; B.energy -= cost(c);
    if (R(4)) B.cn++;
    B.hand.splice(i, 1); B.sel = null; B.pc++;
    B.en.forEach(e => e.el.classList.remove('tg'));
    const tg = c.all ? B.en.filter(e => e.hp > 0) : [t];
    
    if (c.m) B.amp += c.m; if (c.s) B.str += c.s; if (c.k) { B.blk += c.k; fx('#4da3ff55'); }
    if (c.hb) { B.blk += c.hb * B.hand.length; fx('#4da3ff55'); }
    if (R(18) && (c.d || c.bd)) B.blk += 2;
    if (c.dc) { B.hand = shuf(B.hand); for (let j = 0; j < c.dc; j++) if (B.hand.length) B.disc.push(B.hand.pop()); }
    hud();
    
    if (c.d || c.bd || c.cp || c.pn) {
        say(`${nm(tg[0])} is struck!`);
        const hn = c.n || 1, fm = R(1) && !B.fa ? 1.5 : 1;
        B.fa = 1;
        for (let h = 0; h < hn; h++) {
            for (const e of tg) if (e.hp > 0) {
                dmgE(e, Math.floor(amp(c.bd ? B.blk : c.cp ? c.cp * B.pc + B.str : c.pn ? c.pn * Math.max(0, B.hp0 - S.hp) + B.str : c.d + B.str) * fm * (c.lh && S.hp * 2 <= S.mhp ? 2 : 1)), c.pi);
                if (e.hp <= 0 && R(7)) S.hp = Math.min(S.mhp, S.hp + 3);
            }
            await sleep(170);
        }
    }
    
    for (const e of tg) {
        if (c.v) e.vul += c.v + (R(16) ? 1 : 0);
        if (c.p) e.psn += R(15) ? Math.round(amp(c.p) * 1.3) : amp(c.p);
        if (c.px) e.psn *= 2;
        if (c.pt && e.hp > 0) { const d = e.psn; e.hp -= d; fl(e.el.querySelector('.sw'), '-' + d, '#b46bff'); if (e.hp <= 0) kill(e); }
        if (c.p || c.v || c.px || c.pt) upd(e);
    }
    
    if (c.p) fx('#b46bff44');
    if (c.sd) { S.hp = Math.max(1, S.hp - c.sd); fl($('#hpw'), '-' + c.sd, '#ff4d5e'); }
    if (c.h) { S.hp = Math.min(S.mhp, S.hp + c.h); fl($('#hpw'), '+' + c.h, '#59e07a'); }
    if (c.w) drawN(c.w); if (c.e) B.energy += c.e;
    if (R(17) && c.c === 0 && (B.r17 || 0) < 2) { B.r17 = (B.r17 || 0) + 1; drawN(1); }
    
    if (!c.x || R(19)) B.disc.push(o);
    
    if (B.en.every(e => e.hp <= 0)) return win();
    B.busy = false; hud();
    if (freeNow()) say('Your next card is free!');
}

$('#end').onclick = async () => {

const AB = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', ASALT = 'shapes-ascension-v1';
const ahash = str => { let a = 0xdeadbeef, b = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const k = str.charCodeAt(i); a = Math.imul(a ^ k, 2654435761); b = Math.imul(b ^ k, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return [a >>> 0, b >>> 0]; };
const ab5 = (v, n) => { let o = ''; for (let i = n - 1; i >= 0; i--) o += AB[(v >>> (i * 5)) & 31]; return o; };
// code = class + ascension (masked) + checksum; a code only decodes to the class that earned it
const ascEnc = (cls, asc) => { const p = (cls << 11) | Math.min(asc, 2047), m = p ^ (ahash(ASALT)[0] & 0x7fff), c = ahash(ASALT + ':' + p)[1] & 0x1ffffff, t = ab5(m, 3) + ab5(c, 5); return t.slice(0, 4) + '-' + t.slice(4); };
const ascDec = str => {
    const t = String(str).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (t.length != 8 || [...t].some(ch => AB.indexOf(ch) < 0)) return null;
    const v = [...t].map(ch => AB.indexOf(ch)), m = (v[0] << 10) | (v[1] << 5) | v[2];
    let c = 0; for (let i = 3; i < 8; i++) c = c * 32 + v[i];
    const p = m ^ (ahash(ASALT)[0] & 0x7fff), cls = p >> 11, asc = p & 2047;
    if (cls >= CL.length || asc < 1 || (ahash(ASALT + ':' + p)[1] & 0x1ffffff) !== c) return null;
    return { cls, asc };
};

    const o = rollRel(count);
    ov(`<div>Take a relic</div><div class='row'>${o.map(n => `<button class='win big' data-n='${n}'>${rs(n, 44)}<small>${RL[n].t}</small>${RL[n].w < 2 ? '<small style="color:var(--gold)">wild</small>' : ''}</button>`).join('')}</div><button class='win pb' id='sk'>Skip</button>`);
    document.querySelectorAll('#ov .big').forEach(b => b.onclick = () => addRel(+b.dataset.n, next, next));
    $('#sk').onclick = next;
}

function addRel(n, onSuccess, onCancel) {
    if (S.rel.length < 5) {
        S.rel.push(n); if (B) hud(); return onSuccess();
    }
    ov(`<div>Slots full. Replace one?</div><div class='row'>${S.rel.map((r, i) => `<button class='win big' data-i='${i}'>${rs(r, 36)}<small>${RL[r].t}</small></button>`).join('')}</div><button class='win pb' id='sk'>Cancel</button>`);
    document.querySelectorAll('#ov .big').forEach(b => b.onclick = () => {
        const o = S.rel[+b.dataset.i];
        S.rel[+b.dataset.i] = n; if (B) hud(); onSuccess();
    });
    $('#sk').onclick = onCancel;
}

// [shape, color, name, subtitle, % chance the door appears]
const DR = { f: ['arch', '#70a1ff', 'Proceed', 80], e: ['crown', '#ff4d5e', 'Elite', 30], s: ['tag', '#ffd54a', 'Shop', 35], v: ['clover', '#c56cf0', 'Event', 40], r: ['heart', '#59e07a', 'Rest', 30] };

function restSite() {
    const hl = Math.round(S.mhp * .25);
    ov(`<div>Rest Site</div><div class='row'><button class='win big' id='rh'><div style="font-size:24px;margin-bottom:4px">☕</div>Heal ${hl}</button></div><button class='win pb' id='lv'>Skip</button>`);
    $('#rh').onclick = () => { S.hp = Math.min(S.mhp, S.hp + hl); fight(); };
    $('#lv').onclick = fight;
}

function doors() {
    if (S.f % 9 == 8) return bossDoors();
    let t = shuf(Object.keys(DR).filter(k => rnd(100) < DR[k][3])).slice(0, 3);
    if (!t.length) t = ['f'];
    ov(`<div>${t.length > 1 ? 'Choose a door' : 'A door appears'}</div><div class='row'>${t.map(k => `<button class='win big' data-k='${k}'><div style='width:54px'>${shape(DR[k][0], DR[k][1], 54)}</div><span>${DR[k][2]}</span></button>`).join('')}</div>`);
    document.querySelectorAll('#ov .big').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (k == 'f') fight();
        else if (k == 'e') { hide(); start(1); }
        else if (k == 'r') restSite();
        else k == 's' ? shop() : event();
    });
}

function bossDoors() {
    const b = BOSSES[(S.f / 9 | 0) % 3];
    const sides = ['s', 'r'].filter(k => rnd(100) < DR[k][3]);
    let L = '', Rt = '';
    if (sides.length == 2) [L, Rt] = shuf(sides);
    else if (sides.length) Math.random() < .5 ? L = sides[0] : Rt = sides[0];
    const cell = k => k ? `<button class='win big' data-k='${k}' style='width:90px'><div style='width:54px'>${shape(DR[k][0], DR[k][1], 54)}</div><span>${DR[k][2]}</span></button>` : '<div></div>';
    ov(`<div>The boss awaits</div><div style='display:grid;grid-template-columns:90px 130px 90px;gap:10px;align-items:center;justify-content:center'>${cell(L)}<button class='win big' data-k='b' style='width:130px;padding:16px 6px'><div style='width:84px'>${shape(b.s, b.col, 84)}</div><span>Boss</span></button>${cell(Rt)}</div>`);
    document.querySelectorAll('#ov .big').forEach(el => el.onclick = () => {
        const k = el.dataset.k;
        if (k == 'b') fight();
        else k == 's' ? shop() : restSite();
    });
}

function pickCard(t, cb, bk, filt) {
    ov(`<div>${t}</div><div class='row' style='max-height:62%;overflow-y:auto;gap:14px 8px;padding-top:12px'>${S.deck.map((c, i) => cardH(c, i, filt && !filt(c) ? 'no' : '')).join('')}</div><button class='win pb' id='cn'>Back</button>`);
    document.querySelectorAll('#ov .cd:not(.no)').forEach(el => el.onclick = () => cb(+el.dataset.i));
    $('#cn').onclick = bk;
}

function shop() {
    const cs = shuf([...S.cl.pool, ...NEU]).slice(0, 3);
    const isRel = Math.random() < .3;
    const pt = isRel ? [] : [{ ...pick(POTIONS) }], rl = isRel ? rollRel(1) : [];
    const rp = n => Math.round((RL[n].w < 2 ? 60 : 35) * fsc);
    const fsc = 1 + (S.f * 0.08);
    const pr = c => Math.round((c.pot ? 30 : 14 + c.c * 8) * fsc);
    const ug = {
        s: { t: 'Sharpen which?', n: 'Sharpen', d: '+40%, max 2 per card', i: '⚒️', p: Math.round(35 * fsc), done: 0, f: c => up(c), ok: c => !c.pot && (c.su || 0) < 2 && (c.d || c.k || c.p || c.h) },
        l: { t: 'Lighten which?', n: 'Lighten', d: '-1 cost, max 2 per card', i: '🪶', p: Math.round(45 * fsc), done: 0, f: c => ({ ...c, lu: (c.lu || 0) + 1, c: Math.max(0, c.c - 1) }), ok: c => !c.pot && (c.lu || 0) < 2 && c.c > 0 }
    };
    const op = ok => ok ? '' : 'opacity:.4';
    const full = () => S.potions.length >= 3;
    
    const dr = () => {
        const rm = Math.round((25 + 10 * S.rm) * fsc);
        ov(`<div>${ic('gld', 14)} ${S.gold}</div>
        <div class='row L'>${cs.map((c, i) => `<div>${c ? cardH(c, i) : '<div class=cd></div>'}<button class='win pb' data-c='${i}' style='${op(c && S.gold >= pr(c))}'>${c ? pr(c) : '-'}</button></div>`).join('')}</div>
        <div class='row'>
            ${rl.map((n, i) => `<button class='win big' data-r='${i}' style='${op(n && S.gold >= rp(n))}'>${n ? rs(n, 40) + `<small>${RL[n].t}</small><span>${rp(n)}</span>` : '-'}</button>`).join('')}
            ${pt.map((p, i) => `<div>${p ? cardH(p, i) : '<div class=cd></div>'}<button class='win pb' data-p='${i}' style='${op(p && !full() && S.gold >= pr(p))}'>${p ? (full() ? 'Full' : pr(p)) : '-'}</button></div>`).join('')}
            ${Object.entries(ug).map(([k, u]) => `<button class='win big' data-u='${k}' style='${op(!u.done && S.gold >= u.p)}'><div style="font-size:24px">${u.i}</div>${u.n}<small>${u.d}</small><span>${u.done ? 'Sold' : u.p}</span></button>`).join('')}
        </div>
        <div class='row'><button class='win pb' id='rm' style='${op(S.gold >= rm)}'>Remove ${rm}</button><button class='win pb' id='lv'>Leave</button></div>`);
        
        document.querySelectorAll('#ov [data-c]').forEach(b => b.onclick = () => { const i = +b.dataset.c, c = cs[i]; if (c && S.gold >= pr(c)) { S.gold -= pr(c); S.deck.push(c); cs[i] = null; dr(); } });
        document.querySelectorAll('#ov [data-r]').forEach(b => b.onclick = () => { const i = +b.dataset.r, n = rl[i]; if (n && S.gold >= rp(n)) { addRel(n, () => { S.gold -= rp(n); rl[i] = 0; dr(); }, dr); } });
        document.querySelectorAll('#ov [data-p]').forEach(b => b.onclick = () => { const i = +b.dataset.p, p = pt[i]; if (p && !full() && S.gold >= pr(p)) { S.gold -= pr(p); S.potions.push(p); pt[i] = null; dr(); } });
        document.querySelectorAll('#ov [data-u]').forEach(b => b.onclick = () => {
            const u = ug[b.dataset.u];
            if (u.done || S.gold < u.p) return;
            pickCard(u.t, i => { S.gold -= u.p; S.deck[i] = u.f(S.deck[i]); u.done = 1; dr(); }, dr, u.ok);
        });
        $('#rm').onclick = () => { if (S.gold >= rm) pickCard('Remove which?', i => { S.gold -= rm; S.rm++; S.deck.splice(i, 1); dr(); }, dr); };
        $('#lv').onclick = fight;
    };
    dr();
}

let cur;
const ok = t => { ov(`<div>${t}</div><button class='win pb' id='ok'>Continue</button>`); $('#ok').onclick = fight; }, bk = () => event(cur), up = c => { const o = { ...c, su: (c.su || 0) + 1 }; ['d', 'k', 'p', 'h'].forEach(k => o[k] && (o[k] = Math.ceil(o[k] * 1.4))); return o; };
const EV = [['A coin spins in the dark.', [['Flip it', () => Math.random() < .5 ? (S.gold += 45, ok('+45 gold')) : (S.hp = Math.max(1, S.hp - 10), ok('-10 hp'))], ['Leave', fight]]], ['An altar hums, hungry.', [['Pay 12% hp for a relic', () => { S.hp = Math.max(1, S.hp - Math.round(S.mhp * .12)); relicPick(fight); }], ['Leave', fight]]], ['A hollow shape offers gold.', [['Take 60 gold and a dead card', () => { S.gold += 60; S.deck.push({ c: 3, st: 1, nm: 'Dead Weight' }); fight(); }], ['Leave', fight]]], ['Dead weight can be shed.', [['Remove a card', () => pickCard('Remove which?', i => { S.deck.splice(i, 1); fight(); }, bk)], ['Leave', fight]]], ['An echo repeats itself.', [['Duplicate a card', () => pickCard('Copy which?', i => { S.deck.push(S.deck[i]); fight(); }, bk)], ['Leave', fight]]], ['A whetstone and a feather.', [['Sharpen a card (+40%, max 2)', () => pickCard('Sharpen which?', i => { S.deck[i] = up(S.deck[i]); fight(); }, bk, c => !c.pot && (c.su || 0) < 2 && (c.d || c.k || c.p || c.h))], ['Lighten a card (-1 cost, max 2)', () => pickCard('Lighten which?', i => { S.deck[i] = { ...S.deck[i], lu: (S.deck[i].lu || 0) + 1, c: Math.max(0, S.deck[i].c - 1) }; fight(); }, bk, c => !c.pot && (c.lu || 0) < 2 && c.c > 0)], ['Leave', fight]]]];

function event(e) {
    cur = e = e || pick(EV);
    ov(`<div style='max-width:300px'>${e[0]}</div>${e[1].map((o, i) => `<button class='win pb' data-o='${i}' style='padding:8px 16px;margin:6px auto'>${o[0]}</button>`).join('')}`);
    document.querySelectorAll('#ov [data-o]').forEach(b => b.onclick = () => e[1][+b.dataset.o][1]());
}

function lose() {
    say('You fade away.');
    setTimeout(() => ov(`<div>${shape(S.cl.s, '#444', 80)}</div><div style="font-size:16px">Reached floor ${S.f + 1}${S.asc ? ' · ASC ' + S.asc : ''}</div><button class="win big" style="width:auto;padding:10px 24px" id="re">Again</button>`) || ($('#re').onclick = menu), 900);
}

menu();
</script>
</body>
</html>
